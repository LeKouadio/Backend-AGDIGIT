spring.application.name=agdigit-backend

# Charge en plus application-local.properties s'il existe. C'est la qu'on met
# le mot de passe : ce fichier est dans .gitignore, il ne part donc jamais sur
# GitHub. Si le fichier est absent, Spring l'ignore sans erreur.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------------------------------------------------------------------------
# Connexion PostgreSQL
# ---------------------------------------------------------------------------
# C'est LE point a regler en premier : tant que cette connexion echoue, rien
# d'autre ne peut fonctionner. Tout est surchargeable par variable
# d'environnement, pour ne jamais commiter de mot de passe.
#
#   PowerShell :  $env:AGDIGIT_DB_PASSWORD = "monmotdepasse"
#   Bash       :  export AGDIGIT_DB_PASSWORD=monmotdepasse
#
spring.datasource.url=jdbc:postgresql://${AGDIGIT_DB_HOST:localhost}:${AGDIGIT_DB_PORT:5432}/${AGDIGIT_DB_NAME:dashboard_db}
spring.datasource.username=${AGDIGIT_DB_USER:postgres}
spring.datasource.password=${AGDIGIT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# `none` : Hibernate ne cree ni ne modifie aucune table. Le schema appartient a
# la plateforme AGDIGIT et les donnees sont ecrites par n8n — cette application
# ne fait que lire. Ne jamais passer a `update` ou `create` sur cette base.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mettre a true pour voir le SQL genere pendant la mise au point.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Serveur
# ---------------------------------------------------------------------------
server.port=${AGDIGIT_PORT:8080}

# Origines autorisees a appeler l'API (frontend Angular en developpement).
agdigit.cors.origines=http://localhost:4200

# ---------------------------------------------------------------------------
# Authentification JWT
# ---------------------------------------------------------------------------
# La cle signe les jetons : quiconque la connait peut en fabriquer. En
# production elle vient de l'environnement ; la valeur par defaut ci-dessous
# n'est acceptable que pour une demonstration locale.
agdigit.jwt.secret=${AGDIGIT_JWT_SECRET:agdigit-demo-cle-de-signature-a-remplacer-en-production}
agdigit.jwt.duree-heures=${AGDIGIT_JWT_DUREE_HEURES:12}

# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
logging.level.ci.ageroute.agdigit=DEBUG
