spring.application.name=agdigit-backend

# ---------------------------------------------------------------------------
# Connexion PostgreSQL
# ---------------------------------------------------------------------------
# C'est LE point a regler en premier : tant que cette connexion echoue, rien
# d'autre ne peut fonctionner. Les valeurs ci-dessous sont surchargeables par
# variables d'environnement, pour ne jamais commiter de mot de passe.
#
#   PowerShell :  $env:AGDIGIT_DB_PASSWORD = "monmotdepasse"
#   Bash       :  export AGDIGIT_DB_PASSWORD=monmotdepasse
#
spring.datasource.url=jdbc:postgresql://${AGDIGIT_DB_HOST:localhost}:${AGDIGIT_DB_PORT:5432}/${AGDIGIT_DB_NAME:agdigit}
spring.datasource.username=${AGDIGIT_DB_USER:postgres}
spring.datasource.password=${AGDIGIT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# `none` : Hibernate ne cree ni ne modifie aucune table. Le schema appartient a
# la plateforme AGDIGIT et les donnees sont ecrites par n8n — cette application
# ne fait que lire. Ne jamais passer a `update` ou `create` sur cette base.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mettre a true pour voir le SQL genere pendant la mise au point.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Serveur
# ---------------------------------------------------------------------------
server.port=${AGDIGIT_PORT:8080}

# Origines autorisees a appeler l'API (frontend Angular en developpement).
agdigit.cors.origines=http://localhost:4200

# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
logging.level.ci.ageroute.agdigit=DEBUG
