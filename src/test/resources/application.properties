# Configuration utilisee UNIQUEMENT par les tests.
# Base H2 en memoire : les tests demarrent sans PostgreSQL, ce qui permet de
# verifier que le contexte Spring se charge meme sur un poste ou la base n'est
# pas encore installee.
spring.datasource.url=jdbc:h2:mem:agdigit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
